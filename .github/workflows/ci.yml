name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_generation_scales:
        description: Rerun the explicit native scale measurements (not part of ordinary pushes)
        type: boolean
        default: false
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hustcer/setup-moonbit@bdc8c076af1f4c5012a6ac3451a2009ec75bf921 # v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon version --all
      - name: Initialize dependency registry on a fresh runner
        run: moon update
      - run: moon fmt --check
      - run: |
          moon info
          test -z "$(git status --porcelain -- '*.mbti')"
      - run: moon check --target native --deny-warn
      - run: moon build --target native
      - name: Core check/build on JS and Wasm-GC (native CLI excluded by package declaration)
        run: |
          for target in js wasm-gc; do
            moon check --target "$target" --deny-warn
            moon build --target "$target"
          done
      - name: Clean-source package audit and external candidate consumer
        run: |
          python3 -m unittest discover -s scripts -p test_release_audit.py
          python3 scripts/release_audit.py | tee release-audit.log
          python3 - <<'PY'
          import json,pathlib,subprocess,sys
          rows=[line.removeprefix('RELEASE AUDIT ') for line in pathlib.Path('release-audit.log').read_text().splitlines() if line.startswith('RELEASE AUDIT ')]
          if len(rows)!=1:raise RuntimeError('missing/duplicate audit result')
          report=pathlib.Path(json.loads(rows[0])['report']);audit=json.loads(report.read_text())
          subprocess.run([sys.executable,'scripts/release_consumer.py','--candidate',audit['package_path'],'--audit',str(report),'--targets','native','js','wasm-gc'],check=True,timeout=600)
          PY
      - run: python3 -m unittest discover -s scripts -p test_acceptance.py
      - run: python3 scripts/check_format_vectors.py
      - run: python3 scripts/check_matching_vectors.py
      - run: python3 scripts/check_diff.py
      - name: Offline benchmark record integrity (no timing on push)
        run: python3 scripts/benchmark.py --verify
      - run: python3 scripts/measure_diff.py --verify-report
      - run: python3 -m unittest discover -s scripts -p test_diff_verifier.py
      - name: Offline interoperability inventory and strict comparator contracts
        run: |
          python3 scripts/run_conformance.py
          python3 -m unittest discover -s scripts -p test_conformance.py
      - run: python3 scripts/check_apply.py
      - run: python3 scripts/check_apply_boundaries.py
      - run: python3 scripts/measure_apply.py --verify-report
      - run: python3 scripts/check_compression.py
      - run: python3 scripts/generate_reference.py
      - run: python3 -m unittest discover -s scripts -p test_reference.py
      - name: Run nonempty tests
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_acceptance.py --test-log test.log -- moon test --target native --deny-warn
          grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' test.log
      - run: python3 scripts/check_compression.py --log test.log --large
      - run: python3 scripts/check_diff.py --log test.log
      - run: python3 scripts/measure_diff.py --stream-log test.log
      - name: Compact compression contracts on JS and Wasm-GC
        shell: bash
        run: |
          set -o pipefail
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "compression-$target.log" -- moon test compression_wbtest.mbt --filter 'compression-compact*' --target "$target" --deny-warn
            grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' "compression-$target.log"
            python3 scripts/check_compression.py --log "compression-$target.log"
          done

      - name: Apply on JS and Wasm-GC
        shell: bash
        run: |
          set -o pipefail
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "apply-$target.log" -- moon test apply_test.mbt apply_vectors_test.mbt apply_boundaries_test.mbt apply_resources_test.mbt --target "$target" --deny-warn
            grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' "apply-$target.log"
          done

      - name: Compact suffix-index correctness on JS and Wasm-GC
        shell: bash
        run: |
          set -o pipefail
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "suffix-$target.log" -- moon test suffix_array_wbtest.mbt --filter 'suffix-compact*' --target "$target" --deny-warn
            grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' "suffix-$target.log"
          done

      - name: Compact matching correctness on JS and Wasm-GC
        shell: bash
        run: |
          set -o pipefail
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "matching-$target.log" -- moon test matching_wbtest.mbt matching_vectors_wbtest.mbt --filter 'matching-compact*' --target "$target" --deny-warn
            grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' "matching-$target.log"
          done

      - name: Compact generation on JS and Wasm-GC
        shell: bash
        run: |
          set -o pipefail
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "diff-$target.log" -- moon test diff_test.mbt diff_vectors_test.mbt diff_wbtest.mbt --target "$target" --deny-warn
            grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' "diff-$target.log"
          done

      - name: Compact reusable-index API on JS and Wasm-GC (native covered above)
        shell: bash
        run: |
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "index-$target.log" -- moon test diff_index_test.mbt --target "$target" --deny-warn
          done
          moon run examples/index-reuse --target js

      - name: Compact generation resource contracts on JS and Wasm-GC
        shell: bash
        run: |
          set -o pipefail
          for target in js wasm-gc; do
            python3 scripts/check_acceptance.py --test-log "diff-resource-$target.log" -- moon test diff_resources_test.mbt diff_resources_wbtest.mbt --filter 'diff-resource-compact*' --target "$target" --deny-warn
            grep -E 'Total tests: [1-9][0-9]*, passed: [1-9][0-9]*, failed: 0' "diff-resource-$target.log"
          done

  cli-native:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hustcer/setup-moonbit@bdc8c076af1f4c5012a6ac3451a2009ec75bf921 # v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon version --all
      - run: moon update
      - name: Verify generated version and native interfaces
        shell: bash
        run: |
          python scripts/build_cli.py --check-version
          moon info --target native
          git status --porcelain -- '*.mbti'
          git diff --exit-code -- '*.mbti'
          test -z "$(git status --porcelain -- '*.mbti')"
      - name: Linux native CLI file and private IO contracts
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build_cli.py
          python3 scripts/test_cli.py --exe _build/bin/linux/moonbsdiff
          python3 scripts/test_cli_limits.py --exe _build/bin/linux/moonbsdiff
          python3 scripts/test_cli_inspect.py --exe _build/bin/linux/moonbsdiff
          python3 scripts/test_cli_manifest.py --exe _build/bin/linux/moonbsdiff
          python3 scripts/test_cli_verify.py --exe _build/bin/linux/moonbsdiff
      - name: Real unprivileged ext4 delivery without proc (private mount namespace)
        if: runner.os == 'Linux'
        run: python3 scripts/test_linux_delivery.py --exe _build/bin/linux/moonbsdiff
      - name: Memory library and fixed Wasm update examples (once, Linux only)
        if: runner.os == 'Linux'
        run: python3 scripts/run_examples.py --cli _build/bin/linux/moonbsdiff
      - name: Windows native type check
        if: runner.os == 'Windows'
        run: moon check --target native --deny-warn
      - name: Windows native CLI file and private IO contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC build tools not found' }
          $dev = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          cmd /c "call `"$dev`" >nul && python scripts/build_cli.py && python scripts/test_cli.py --exe _build/bin/windows/moonbsdiff.exe && python scripts/test_cli_limits.py --exe _build/bin/windows/moonbsdiff.exe && python scripts/test_cli_inspect.py --exe _build/bin/windows/moonbsdiff.exe && python scripts/test_cli_manifest.py --exe _build/bin/windows/moonbsdiff.exe && python scripts/test_cli_verify.py --exe _build/bin/windows/moonbsdiff.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and validate Linux release archive once
        if: runner.os == 'Linux'
        run: python3 scripts/package_cli.py
      - name: Package and validate Windows release archive once
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC build tools not found' }
          $dev = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          cmd /c "call `"$dev`" >nul && python scripts/package_cli.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified platform distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-dist-${{ runner.os }}
          path: _build/cli-dist/*
          if-no-files-found: error
          retention-days: 30

  cli-distribution:
    name: Collect source-bound CLI release assets
    needs: cli-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-dist-*
          path: _build/cli-platform-artifacts
      - name: Verify distribution collection contracts
        run: python3 -m unittest discover -s scripts -p test_cli_distribution.py
      - name: Bind both archives to this workflow source and produce checksums
        run: python3 scripts/collect_cli_release.py --input _build/cli-platform-artifacts --output _build/cli-release --source-sha "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-release-${{ github.sha }}
          path: _build/cli-release/*
          if-no-files-found: error
          retention-days: 30

  reference:
    name: Real BSDiff reference interoperability
    runs-on: ubuntu-latest
    env:
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hustcer/setup-moonbit@bdc8c076af1f4c5012a6ac3451a2009ec75bf921 # v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon version --all
      - run: moon update
      - name: Build locked oracle once and execute source-bound bidirectional matrix
        run: python3 scripts/check_acceptance.py --reference

  generation-scales:
    name: Native larger-input policies (256 KiB then 1 MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # verify historical measurement bytes at their original SHA
      - uses: hustcer/setup-moonbit@bdc8c076af1f4c5012a6ac3451a2009ec75bf921 # v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon version --all
      - run: moon update
      - name: Verify fixed policies and historical scale evidence without timing
        run: python3 scripts/generation_scale.py --verify-report
      - name: Execute only the six new native-release inputs in stage order
        if: github.event_name == 'workflow_dispatch' && inputs.run_generation_scales
        run: |
          python3 scripts/generation_scale.py --measure-stage 256k --output _build/scale256.json
          python3 scripts/generation_scale.py --measure-stage 1m --prior _build/scale256.json --output _build/scale-all.json
      - name: Replay two explicit public CLI policies with matching patch read caps
        if: github.event_name == 'workflow_dispatch' && inputs.run_generation_scales
        run: |
          python3 scripts/build_cli.py --release
          python3 scripts/generation_scale.py --replay-cli _build/bin/linux/moonbsdiff --stage 256k --case random
          python3 scripts/generation_scale.py --replay-cli _build/bin/linux/moonbsdiff --stage 1m --case random
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' && inputs.run_generation_scales
        with:
          name: generation-scales-${{ github.sha }}
          path: |
            _build/scale-all.json
            _build/generation-scales/cli-*.json
          if-no-files-found: error
          retention-days: 30
